---
name: Validate public automation helpers

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
          python3 -m pip install --disable-pip-version-check 'ansible-core>=2.18,<2.20'

      - name: Check Bash syntax
        run: bash -n scripts/*.sh tests/*.sh

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Run functional tests
        # The isolated bootstrap test may download its container and packages;
        # it never connects to managed infrastructure.
        run: |
          tests/test-audit-managed-host.sh
          tests/test-build-known-hosts-entry.sh
          tests/test-upsert-known-hosts-entry.sh
          set +e
          tests/test-bootstrap-managed-host.sh
          bootstrap_rc=$?
          set -e
          case "$bootstrap_rc" in
            0) echo "bootstrap-managed-host: PASS" ;;
            77) echo "bootstrap-managed-host: SKIP" ;;
            *) echo "bootstrap-managed-host: FAIL" >&2; exit "$bootstrap_rc" ;;
          esac
          python3 tests/test-send-wol.py
          python3 tests/test-k3s-lifecycle.py
          ansible-playbook -i localhost, --connection=local tests/test-ansible-json-item-access.yml

      - name: Compile Python helpers
        run: python3 -m compileall -q cluster/scripts scripts tests

      - name: Check executable modes
        run: |
          test -x cluster/scripts/send-wol.py
          test -x scripts/scan-public-tree.py
          test -x tests/test-send-wol.py
          test -x tests/test-k3s-lifecycle.py
          test -z "$(find cluster/playbooks docs -type f -perm /111 -print -quit)"
          test ! -x .github/workflows/validate-scripts.yml
          test ! -x tests/test-ansible-json-item-access.yml

      - name: Parse workflow YAML
        run: python3 -c 'import pathlib, yaml; yaml.safe_load(pathlib.Path(".github/workflows/validate-scripts.yml").read_text())'

      - name: Syntax-check every public playbook
        run: |
          validation_dir="$(mktemp -d)"
          trap 'rm -rf -- "$validation_dir"' EXIT
          inventory="$validation_dir/inventory.yml"
          cat >"$inventory" <<'YAML'
          all:
            hosts:
              host1:
                ansible_connection: local
                ansible_host: 192.0.2.10
                mac_address: "02:00:00:00:00:01"
              host2:
                ansible_connection: local
                ansible_host: 192.0.2.11
                mac_address: "02:00:00:00:00:02"
              host3:
                ansible_connection: local
                ansible_host: 192.0.2.12
                mac_address: "02:00:00:00:00:03"
            children:
              masters:
                hosts:
                  host1:
              workers:
                hosts:
                  host2:
                  host3:
              k3s_cluster:
                children:
                  masters:
                  workers:
              k3s_servers:
                children:
                  k3s_cluster:
              homelab_managed:
                hosts:
                  host1:
              update_standard:
                hosts:
                  host1:
              update_automatic:
                hosts:
                  host1:
              reboot_approved:
                hosts:
                  host1:
          YAML
          export ANSIBLE_LOCAL_TEMP="$validation_dir/ansible-local"
          while IFS= read -r playbook; do
            ansible-playbook -i "$inventory" "$playbook" --syntax-check
          done < <(find cluster/playbooks homelab/playbooks -type f -name '*.yml' -print | sort)

      - name: Scan public repository
        run: scripts/scan-public-tree.py scripts tests cluster docs .github README.md homelab/README.md

      - name: Check whitespace
        run: git diff --check
