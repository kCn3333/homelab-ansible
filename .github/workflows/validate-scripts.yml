---
name: Validate onboarding scripts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck ripgrep

      - name: Check Bash syntax
        run: bash -n scripts/*.sh tests/*.sh

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Run functional tests
        run: |
          tests/test-audit-managed-host.sh
          tests/test-build-known-hosts-entry.sh
          tests/test-upsert-known-hosts-entry.sh
          tests/test-bootstrap-managed-host.sh

      - name: Scan public repository
        run: |
          scan_paths=(scripts tests docs .github README.md homelab/README.md)
          if rg -q -- '-----BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]+' "${scan_paths[@]}"; then
            echo "Potential secret material detected." >&2
            exit 1
          fi
          if rg --pcre2 '(?<![0-9])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![0-9])' "${scan_paths[@]}" | rg -qv '192\.0\.2\.0/24'; then
            echo "Unexpected IPv4 address detected." >&2
            exit 1
          fi
          if rg -q --pcre2 '(?<![[:alnum:]])(?:[0-9a-f]{1,4}:){2,7}[0-9a-f]{0,4}(?![[:alnum:]])' "${scan_paths[@]}"; then
            echo "Unexpected IPv6 address detected." >&2
            exit 1
          fi
          if rg -q 'https?://|[[:alnum:]-]+\.(com|net|org|io|dev|local|lan|internal)([^[:alnum:]-]|$)' "${scan_paths[@]}"; then
            echo "Unexpected domain or URL detected." >&2
            exit 1
          fi

      - name: Check whitespace
        run: git diff --check
