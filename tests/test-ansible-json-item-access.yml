---
- name: Verify native inventory and Node collections
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    expected_hosts: [master, worker1, worker2]
    live_hosts: [worker2, master, worker1]
    mac_pattern: '^(?:(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}|(?:[0-9A-Fa-f]{2}-){5}[0-9A-Fa-f]{2})$'
    valid_unicast_macs:
      - 7c:d3:0a:76:b6:f4
      - 7C:D3:0A:76:B6:F4
      - 7c-d3-0a-76-b6-f4
    invalid_macs:
      - "{{ ['7c', 'd3', '0a', '76', 'b6'] | join(':') }}"
      - "{{ ['7c', 'd3', '0a', '76', 'b6', 'f4', '00'] | join(':') }}"
      - "{{ ['7c', 'd3-0a', '76', 'b6', 'f4'] | join(':') }}"
      - "{{ ['zz', 'd3', '0a', '76', 'b6', 'f4'] | join(':') }}"
      - ''
      - 01:00:5e:00:00:01
      - ff:ff:ff:ff:ff:ff
  tasks:
    - name: Build the inventory contract with native lists
      ansible.builtin.set_fact:
        masters: "{{ expected_hosts[:1] }}"
        workers: "{{ expected_hosts[1:] }}"
        k3s_cluster: "{{ expected_hosts }}"
        nodes_missing: "{{ expected_hosts | difference(live_hosts) }}"
        nodes_unexpected: "{{ live_hosts | difference(expected_hosts) }}"

    - name: Require complete groups and whole-name comparisons
      ansible.builtin.assert:
        that:
          - masters | type_debug == 'list'
          - workers | type_debug == 'list'
          - k3s_cluster | type_debug == 'list'
          - masters | length == 1
          - workers | length == 2
          - k3s_cluster | length == 3
          - masters | intersect(workers) | length == 0
          - k3s_cluster | sort == (masters + workers) | sort
          - nodes_missing | type_debug == 'list'
          - nodes_unexpected | type_debug == 'list'
          - nodes_missing | length == 0
          - nodes_unexpected | length == 0
          - live_hosts | sort == ['master', 'worker1', 'worker2']

    - name: Accept supported unicast MAC formats
      ansible.builtin.assert:
        that:
          - item is match(mac_pattern)
          - ((item | regex_replace('[:-]', ''))[0:2] | int(base=16)) % 2 == 0
      loop: "{{ valid_unicast_macs }}"
      loop_control:
        label: valid-unicast-mac
      no_log: true

    - name: Reject malformed multicast and broadcast MAC values
      ansible.builtin.assert:
        that:
          - >-
            not (
              item is match(mac_pattern)
              and ((item | regex_replace('[:-]', ''))[0:2] | int(base=16)) % 2 == 0
            )
      loop: "{{ invalid_macs }}"
      loop_control:
        label: invalid-mac
      no_log: true
