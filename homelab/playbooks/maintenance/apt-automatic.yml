---
- name: Run automatic APT maintenance
  hosts: update_automatic
  become: true
  gather_facts: true
  serial: 1
  order: inventory
  tasks:
    - name: Run guarded automatic maintenance
      block:
        - name: Require a Debian-family system
          ansible.builtin.assert:
            that:
              - ansible_facts.os_family == "Debian"
            fail_msg: Automatic APT maintenance requires a Debian-family system.

        - name: Require maintenance notification credentials
          ansible.builtin.assert:
            that:
              - lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_URL', default='') | length > 0
              - lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_TOKEN', default='') | length > 0
            fail_msg: Maintenance notification environment variables are required.
          delegate_to: localhost
          become: false
          no_log: true

        - name: Refresh APT cache when stale
          ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 3600
            lock_timeout: 300
          register: automatic_apt_cache

        - name: Install distribution APT upgrade
          ansible.builtin.apt:
            upgrade: dist
            force_apt_get: true
            allow_downgrade: false
            allow_unauthenticated: false
            allow_change_held_packages: false
            dpkg_options: "force-confdef,force-confold"
            lock_timeout: 300
          register: automatic_apt_upgrade

        - name: Remove obsolete packages
          ansible.builtin.apt:
            autoremove: true
            purge: true
            force_apt_get: true
            lock_timeout: 300
          register: automatic_apt_autoremove

        - name: Remove obsolete package cache entries
          ansible.builtin.apt:
            autoclean: true
            lock_timeout: 300

        - name: Clean the APT package cache
          ansible.builtin.apt:
            clean: true
            lock_timeout: 300

        - name: Reload systemd manager configuration
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Check whether a reboot is required
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: automatic_reboot_required

        - name: Read failed systemd units before orphan cleanup
          ansible.builtin.command:
            cmd: systemctl --failed --no-legend --plain --no-pager
          register: automatic_failed_units_before_cleanup
          changed_when: false
          failed_when: false

        - name: Select orphaned failed systemd units
          ansible.builtin.set_fact:
            automatic_orphaned_failed_units: >-
              {{ automatic_failed_units_before_cleanup.stdout_lines
                 | default([])
                 | select('match', '^\s*\S+\s+not-found\s+failed\s+failed(?:\s|$)')
                 | map('regex_replace', '^\s*(\S+).*', '\1')
                 | list }}

        - name: Reset each orphaned failed systemd unit
          ansible.builtin.command:
            argv:
              - systemctl
              - reset-failed
              - "{{ item }}"
          loop: "{{ automatic_orphaned_failed_units | default([]) }}"
          loop_control:
            label: orphaned failed unit

        - name: Read failed systemd units after orphan cleanup
          ansible.builtin.command:
            cmd: systemctl --failed --no-legend --plain --no-pager
          register: automatic_failed_units_after_cleanup
          changed_when: false
          failed_when: false

        - name: Require a successful systemd check with no failed units
          ansible.builtin.assert:
            that:
              - automatic_failed_units_after_cleanup.rc | default(1) == 0
              - automatic_failed_units_after_cleanup.stdout_lines | default([]) | length == 0
            fail_msg: Automatic maintenance detected failed systemd units.

        - name: Notify that a reboot is required
          ansible.builtin.uri:
            url: >-
              {{ lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_URL', default='') }}
            method: POST
            headers:
              Authorization: >-
                Bearer {{ lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_TOKEN', default='') }}
              Title: Automatic maintenance requires a reboot
              Priority: default
              Tags: warning
            body: Automatic maintenance completed and requires a reboot.
            status_code: 200
          delegate_to: localhost
          become: false
          no_log: true
          when: automatic_reboot_required.stat.exists | default(false)

        - name: Report successful automatic maintenance
          ansible.builtin.debug:
            msg:
              inventory_hostname: "{{ inventory_hostname }}"
              cache_refreshed: "{{ automatic_apt_cache.changed | default(false) }}"
              upgrade_performed: "{{ automatic_apt_upgrade.changed | default(false) }}"
              autoremove_performed: >-
                {{ automatic_apt_autoremove.changed | default(false) }}
              reboot_required: >-
                {{ automatic_reboot_required.stat.exists | default(false) }}
              failed_systemd_units: >-
                {{ automatic_failed_units_after_cleanup.stdout_lines
                   | default([]) | length }}
              orphaned_failed_units_reset: >-
                {{ automatic_orphaned_failed_units | default([]) | length }}

      rescue:
        - name: Attempt automatic maintenance failure notification
          ansible.builtin.uri:
            url: >-
              {{ lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_URL', default='') }}
            method: POST
            headers:
              Authorization: >-
                Bearer {{ lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_TOKEN', default='') }}
              Title: Automatic maintenance failed
              Priority: high
              Tags: rotating_light
            body: Automatic APT maintenance failed.
            status_code: 200
          delegate_to: localhost
          become: false
          no_log: true
          failed_when: false

        - name: Fail automatic maintenance explicitly
          ansible.builtin.fail:
            msg: Automatic APT maintenance failed.
