---
- name: Reboot one approved managed host
  hosts: reboot_approved
  become: true
  gather_facts: false
  serial: 1
  order: inventory
  tasks:
    - name: Run guarded approved reboot workflow
      block:
        - name: Require one explicitly approved reboot target
          ansible.builtin.assert:
            that:
              - reboot_target is defined
              - reboot_target | default('') is string
              - reboot_target | default('') | length > 0
              - reboot_target | default('') == inventory_hostname
              - ansible_play_hosts_all | length == 1
            fail_msg: Exactly one matching reboot target must be explicitly approved.

        - name: Require maintenance notification credentials
          ansible.builtin.assert:
            that:
              - lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_URL', default='') | length > 0
              - lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_TOKEN', default='') | length > 0
            fail_msg: Maintenance notification environment variables are required.
          delegate_to: localhost
          become: false
          no_log: true

        - name: Check whether a reboot is required
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: approved_reboot_required_before

        - name: Require a pending reboot
          ansible.builtin.assert:
            that:
              - approved_reboot_required_before.stat.exists | default(false)
            fail_msg: The approved host does not require a reboot.

        - name: Read failed systemd units before reboot
          ansible.builtin.command:
            cmd: systemctl --failed --no-legend --plain --no-pager
          register: approved_failed_units_before_reboot
          changed_when: false
          failed_when: false

        - name: Require a healthy systemd state before reboot
          ansible.builtin.assert:
            that:
              - approved_failed_units_before_reboot.rc | default(1) == 0
              - approved_failed_units_before_reboot.stdout_lines | default([]) | length == 0
            fail_msg: Failed systemd units require separate diagnostics before reboot.

        - name: Reboot the approved host
          ansible.builtin.reboot:
            msg: Reboot initiated by approved Ansible maintenance
            connect_timeout: 10
            reboot_timeout: 900
            post_reboot_delay: 15
            test_command: whoami
          register: approved_reboot_result

        - name: Require a completed reboot
          ansible.builtin.assert:
            that:
              - approved_reboot_result.rebooted | default(false) == true
            fail_msg: The approved reboot did not complete successfully.

        - name: Check reboot-required marker after reboot
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: approved_reboot_required_after

        - name: Read failed systemd units after reboot
          ansible.builtin.command:
            cmd: systemctl --failed --no-legend --plain --no-pager
          register: approved_failed_units_after_reboot
          changed_when: false
          failed_when: false

        - name: Require a healthy post-reboot state
          ansible.builtin.assert:
            that:
              - not (approved_reboot_required_after.stat.exists | default(false))
              - approved_failed_units_after_reboot.rc | default(1) == 0
              - approved_failed_units_after_reboot.stdout_lines | default([]) | length == 0
            fail_msg: Post-reboot validation failed.

        - name: Notify that the approved reboot completed
          ansible.builtin.uri:
            url: >-
              {{ lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_URL', default='') }}
            method: POST
            headers:
              Authorization: >-
                Bearer {{ lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_TOKEN', default='') }}
              Title: "Reboot completed: {{ inventory_hostname }}"
              Priority: default
              Tags: white_check_mark
            body: "Approved reboot completed successfully on {{ inventory_hostname }}."
            status_code: 200
          delegate_to: localhost
          become: false
          no_log: true

      rescue:
        - name: Attempt approved reboot failure notification
          ansible.builtin.uri:
            url: >-
              {{ lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_URL', default='') }}
            method: POST
            headers:
              Authorization: >-
                Bearer {{ lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_TOKEN', default='') }}
              Title: "Reboot workflow failed: {{ inventory_hostname }}"
              Priority: high
              Tags: rotating_light
            body: "Approved reboot workflow failed on {{ inventory_hostname }}."
            status_code: 200
          delegate_to: localhost
          become: false
          no_log: true
          failed_when: false

        - name: Fail approved reboot workflow explicitly
          ansible.builtin.fail:
            msg: Approved reboot workflow failed.
