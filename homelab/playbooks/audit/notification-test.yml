---
- name: Test maintenance notification
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Require maintenance notification credentials
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_URL', default='') | length > 0
          - lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_TOKEN', default='') | length > 0
        fail_msg: Maintenance notification environment variables are required.
      no_log: true

    - name: Send maintenance notification test
      ansible.builtin.uri:
        url: >-
          {{ lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_URL', default='') }}
        method: POST
        headers:
          Authorization: >-
            Bearer {{ lookup('ansible.builtin.env', 'MAINTENANCE_NTFY_TOKEN', default='') }}
          Title: Ansible maintenance test
          Priority: low
          Tags: white_check_mark
        body: Maintenance notification test completed successfully.
        status_code: 200
      no_log: true

    - name: Report successful maintenance notification test
      ansible.builtin.debug:
        msg: Maintenance notification test succeeded.
