---
- name: Require the cluster group and complete execution without limit
  ansible.builtin.assert:
    that:
      - "'k3s_cluster' in groups"
      - groups.get('k3s_cluster', []) | length > 0
      - ansible_limit is not defined or ansible_limit | trim | length == 0
    fail_msg: UFW configuration requires a nonempty k3s_cluster group and no --limit.

- name: Require an address and all private firewall variables for every node
  ansible.builtin.assert:
    that:
      - hostvars[item].ansible_host is defined
      - hostvars[item].ansible_host | default('') is string
      - hostvars[item].ansible_host | default('') | trim | length > 0
      - hostvars[item].k3s_management_cidr is defined
      - hostvars[item].k3s_management_cidr | default('') is string
      - hostvars[item].k3s_management_cidr | default('') | trim | length > 0
      - hostvars[item].k3s_haproxy_ip is defined
      - hostvars[item].k3s_haproxy_ip | default('') is string
      - hostvars[item].k3s_haproxy_ip | default('') | trim | length > 0
      - hostvars[item].k3s_pod_cidr is defined
      - hostvars[item].k3s_pod_cidr | default('') is string
      - hostvars[item].k3s_pod_cidr | default('') | trim | length > 0
      - hostvars[item].k3s_service_cidr is defined
      - hostvars[item].k3s_service_cidr | default('') is string
      - hostvars[item].k3s_service_cidr | default('') | trim | length > 0
      - hostvars[item].k3s_ufw_obsolete_rules | default([]) is sequence
      - hostvars[item].k3s_ufw_obsolete_rules | default([]) is not string
      - hostvars[item].k3s_ufw_obsolete_rules | default([]) is not mapping
    fail_msg: Each node requires ansible_host and the four nonempty private UFW variables.
  loop: "{{ groups.k3s_cluster }}"
  no_log: true

- name: Validate obsolete rule specifications on every node before mutations
  ansible.builtin.include_tasks: k3s-ufw-obsolete-check.yml
  loop: "{{ groups.k3s_cluster }}"
  loop_control:
    loop_var: k3s_ufw_host
