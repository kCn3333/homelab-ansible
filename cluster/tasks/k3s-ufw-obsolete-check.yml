---
- name: Require explicit obsolete source rules without state or rule numbers
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.rule | default('') in ['allow', 'deny', 'reject', 'limit']
      - item.from_ip | default('') is string
      - item.from_ip | default('') | trim | length > 0
      - item.keys() | list | difference(['rule', 'from_ip', 'to_ip', 'port', 'proto']) | length == 0
      # Do not let an obsolete specification remove a required source rule.
      - >-
        item.from_ip not in
        ([hostvars[k3s_ufw_host].k3s_management_cidr,
          hostvars[k3s_ufw_host].k3s_haproxy_ip,
          hostvars[k3s_ufw_host].k3s_pod_cidr,
          hostvars[k3s_ufw_host].k3s_service_cidr]
         + (groups.k3s_cluster | map('extract', hostvars, 'ansible_host') | list))
    fail_msg: Obsolete rules must be explicit source rules and cannot target a required source.
  loop: "{{ hostvars[k3s_ufw_host].k3s_ufw_obsolete_rules | default([]) }}"
  no_log: true
