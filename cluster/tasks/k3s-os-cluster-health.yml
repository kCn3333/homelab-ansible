---
- name: Read Kubernetes Nodes once
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, nodes, --output=json]
  delegate_to: "{{ k3s_os_kubectl_delegate | default(groups.masters[0]) }}"
  register: k3s_os_node_json
  changed_when: false
  failed_when: k3s_os_node_json.rc != 0

- name: Store Kubernetes Node names
  ansible.builtin.set_fact:
    k3s_os_node_names: >-
      {{ (k3s_os_node_json.stdout | from_json)['items']
         | map(attribute='metadata.name') | list }}

- name: Require exact Kubernetes Node membership
  ansible.builtin.assert:
    that:
      - k3s_os_node_names | length == 3
      - k3s_os_node_names | unique | length == 3
      - k3s_os_node_names | sort == groups.k3s_cluster | sort

- name: Require every Node Ready and schedulable
  ansible.builtin.assert:
    that:
      - k3s_os_matching_nodes | length == 1
      - >-
        k3s_os_matching_nodes[0].status.conditions
        | selectattr('type', 'equalto', 'Ready')
        | selectattr('status', 'equalto', 'True') | list | length == 1
      - not (k3s_os_matching_nodes[0].spec.unschedulable | default(false) | bool)
  vars:
    k3s_os_matching_nodes: >-
      {{ (k3s_os_node_json.stdout | from_json)['items']
         | selectattr('metadata.name', 'equalto', item) | list }}
  loop: "{{ k3s_os_node_names }}"
  loop_control:
    label: "{{ item }}"

- name: Read Longhorn volumes
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, volumes.longhorn.io, -n, longhorn-system, --output=json]
  delegate_to: "{{ k3s_os_kubectl_delegate | default(groups.masters[0]) }}"
  register: k3s_os_longhorn_json
  changed_when: false
  failed_when: k3s_os_longhorn_json.rc != 0
  until: >-
    k3s_os_longhorn_json.rc == 0
    and (k3s_os_longhorn_json.stdout | from_json)['items'] | length > 0
    and ((k3s_os_longhorn_json.stdout | from_json)['items']
         | rejectattr('status.robustness', 'equalto', 'healthy') | list | length) == 0
  retries: 60
  delay: 5

- name: Require healthy Longhorn volumes
  ansible.builtin.assert:
    that:
      - (k3s_os_longhorn_json.stdout | from_json)['items'] | length > 0
      - >-
        (k3s_os_longhorn_json.stdout | from_json)['items']
        | rejectattr('status.robustness', 'equalto', 'healthy') | list | length == 0

- name: Read Pod phases for final validation
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, pods, --all-namespaces, --output=json]
  delegate_to: "{{ k3s_os_kubectl_delegate | default(groups.masters[0]) }}"
  register: k3s_os_pods_json
  changed_when: false
  failed_when: k3s_os_pods_json.rc != 0
  when: k3s_os_check_pod_phases | default(false) | bool

- name: Require every Pod phase to be Running or Succeeded
  ansible.builtin.assert:
    that:
      - >-
        (k3s_os_pods_json.stdout | from_json)['items']
        | rejectattr('status.phase', 'in', ['Running', 'Succeeded']) | list | length == 0
  when: k3s_os_check_pod_phases | default(false) | bool
