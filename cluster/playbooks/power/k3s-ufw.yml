---
- name: Configure UFW for K3s hosts
  hosts: k3s_cluster
  gather_facts: false
  become: true
  strategy: linear
  any_errors_fatal: true
  pre_tasks:
    - name: Validate private UFW inventory variables
      ansible.builtin.assert:
        that:
          - k3s_management_cidr | default('') is string
          - k3s_management_cidr | default('') | trim | length > 0
          - k3s_haproxy_ip | default('') is string
          - k3s_haproxy_ip | default('') | trim | length > 0
          - k3s_cluster_cidr | default('') is string
          - k3s_cluster_cidr | default('') | trim | length > 0
          - k3s_pod_cidr | default('') is string
          - k3s_pod_cidr | default('') | trim | length > 0
          - k3s_additional_ingress_ips is defined
          - k3s_additional_ingress_ips is sequence
          - k3s_additional_ingress_ips is not string
          - k3s_additional_ingress_ips is not mapping
        fail_msg: Define all required K3s UFW variables in private inventory.

  tasks:
    - name: Allow management SSH
      community.general.ufw:
        rule: allow
        from_ip: "{{ k3s_management_cidr }}"
        port: '22'
        proto: tcp
        comment: 'K3s managed: management SSH'

    - name: Allow HAProxy ingress and Kubernetes API
      community.general.ufw:
        rule: allow
        from_ip: "{{ k3s_haproxy_ip }}"
        port: "{{ item }}"
        proto: tcp
        comment: 'K3s managed: HAProxy ingress and API'
      loop: ['6443', '80', '443']

    - name: Allow additional ingress addresses
      community.general.ufw:
        rule: allow
        from_ip: "{{ item.0 }}"
        port: "{{ item.1 }}"
        proto: tcp
      loop: "{{ k3s_additional_ingress_ips | product(['6443', '80', '443']) | list }}"

    - name: Allow K3s cluster TCP traffic
      community.general.ufw:
        rule: allow
        from_ip: "{{ k3s_cluster_cidr }}"
        port: "{{ item }}"
        proto: tcp
      loop: ['6443', '10250', '2379', '2380', '9100', '4443', '4244', '4240']

    - name: Allow K3s cluster UDP traffic
      community.general.ufw:
        rule: allow
        from_ip: "{{ k3s_cluster_cidr }}"
        port: "{{ item }}"
        proto: udp
      loop: ['8472', '51820', '123']

    - name: Allow Pod CIDR traffic
      community.general.ufw:
        rule: allow
        from_ip: "{{ k3s_pod_cidr }}"
        comment: 'K3s managed: Pod CIDR'

    - name: Reject ident with logging
      community.general.ufw:
        rule: reject
        port: '113'
        proto: tcp
        log: true
        comment: 'K3s managed: reject ident with logging'

    - name: Rate limit all other SSH sources
      community.general.ufw:
        rule: limit
        port: '22'
        proto: tcp

    - name: Ensure UFW is enabled
      community.general.ufw:
        state: enabled
