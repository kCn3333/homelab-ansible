---
- name: Validate inventory wake every node and wait for SSH
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    k3s_wol_port: 9
    k3s_wol_count: 3
    k3s_wol_interval: 0.2
    k3s_ssh_wait_timeout: 300
  tasks:
    - name: Require the complete three-node inventory without limit
      ansible.builtin.assert:
        that:
          - ansible_limit is not defined or ansible_limit | trim | length == 0
          - "'masters' in groups"
          - "'workers' in groups"
          - "'k3s_cluster' in groups"
          - groups.masters | length == 1
          - groups.workers | length == 2
          - groups.k3s_cluster | length == 3
          - groups.masters | intersect(groups.workers) | length == 0
          - groups.k3s_cluster | sort == (groups.masters + groups.workers) | sort
        fail_msg: Power On requires the complete three-node inventory and rejects --limit.

    - name: Validate controller Wake-on-LAN settings
      ansible.builtin.assert:
        that:
          - k3s_wol_broadcast is defined
          - k3s_wol_broadcast is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
          - k3s_wol_broadcast.split('.') | map('int') | max <= 255
          - k3s_wol_port | int >= 1
          - k3s_wol_port | int <= 65535
          - k3s_wol_count | int >= 1
          - k3s_wol_count | int <= 100
          - k3s_wol_interval | float >= 0
          - k3s_ssh_wait_timeout | int >= 1

    - name: Validate every host address MAC and Node name
      ansible.builtin.assert:
        that:
          - hostvars[item].ansible_host is defined
          - hostvars[item].ansible_host | string | trim | length > 0
          - hostvars[item].mac_address is defined
          - hostvars[item].mac_address is match('^(?:(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}|(?:[0-9A-Fa-f]{2}-){5}[0-9A-Fa-f]{2})$')
          - ((hostvars[item].mac_address | regex_replace('[:-]', ''))[0:2] | int(base=16)) % 2 == 0
        fail_msg: Every K3s node requires ansible_host and a unicast MAC.
      loop: "{{ groups.k3s_cluster }}"
      loop_control:
        label: "{{ item }}"

    - name: Build normalized MAC list
      ansible.builtin.set_fact:
        k3s_normalized_macs: >-
          {{ groups.k3s_cluster | map('extract', hostvars, 'mac_address')
             | map('regex_replace', '[:-]', '') | map('lower') | list }}

    - name: Require unique MAC addresses and inventory aliases
      ansible.builtin.assert:
        that:
          - k3s_normalized_macs | unique | length == 3
          - groups.k3s_cluster | unique | length == 3

    - name: Send Wake-on-LAN to every host before probing SSH
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../../scripts/send-wol.py"
          - --mac
          - "{{ hostvars[item].mac_address }}"
          - --broadcast
          - "{{ k3s_wol_broadcast }}"
          - --port
          - "{{ k3s_wol_port | string }}"
          - --count
          - "{{ k3s_wol_count | string }}"
          - --interval
          - "{{ k3s_wol_interval | string }}"
      loop: "{{ groups.k3s_cluster }}"
      loop_control:
        label: "{{ item }}"
      register: k3s_wol_results
      changed_when: true
      failed_when: false
      no_log: true

    - name: Wait for every SSH port after all Wake-on-LAN attempts
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: "{{ hostvars[item].ansible_port | default(22) }}"
        state: started
        connect_timeout: 3
        sleep: 2
        timeout: "{{ k3s_ssh_wait_timeout }}"
      loop: "{{ groups.k3s_cluster }}"
      loop_control:
        label: "{{ item }}"
      register: k3s_ssh_results
      failed_when: false

    - name: Require every Wake-on-LAN send and SSH recovery
      ansible.builtin.assert:
        that:
          - k3s_wol_results.results | rejectattr('rc', 'equalto', 0) | list | length == 0
          - k3s_ssh_results.results | selectattr('failed', 'defined') | selectattr('failed') | list | length == 0
        fail_msg: At least one Wake-on-LAN send failed or one host did not return.

- name: Verify every recovered K3s server
  hosts: k3s_cluster
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    k3s_binary_path: /usr/local/bin/k3s
  tasks:
    - name: Verify Ansible connectivity
      ansible.builtin.ping:

    - name: Verify noninteractive sudo
      ansible.builtin.command:
        argv: ["true"]
      become: true
      changed_when: false

    - name: Require active K3s service
      ansible.builtin.command:
        argv: [systemctl, is-active, k3s]
      become: true
      changed_when: false

    - name: Require local API and etcd readiness
      ansible.builtin.command:
        argv: ["{{ k3s_binary_path }}", kubectl, get, "--raw=/readyz?verbose"]
      become: true
      register: k3s_local_readyz
      changed_when: false
      failed_when: >-
        k3s_local_readyz.rc != 0
        or 'readyz check passed' not in k3s_local_readyz.stdout
        or '[+]etcd ok' not in k3s_local_readyz.stdout

- name: Verify the exact Kubernetes Node set from the master
  hosts: masters
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    k3s_binary_path: /usr/local/bin/k3s
  tasks:
    - name: Read Kubernetes Node names
      ansible.builtin.command:
        argv: ["{{ k3s_binary_path }}", kubectl, get, nodes, "--output=jsonpath={range .items[*]}{.metadata.name}{'\\n'}{end}"]
      register: k3s_live_nodes
      changed_when: false

    - name: Build expected Node names
      ansible.builtin.set_fact:
        k3s_expected_node_names: "{{ groups.k3s_cluster }}"

    - name: Require exact Node membership
      ansible.builtin.assert:
        that:
          - k3s_expected_node_names | sort == k3s_live_nodes.stdout_lines | sort
        fail_msg: >-
          Node mismatch; missing={{ k3s_expected_node_names | difference(k3s_live_nodes.stdout_lines) }},
          unexpected={{ k3s_live_nodes.stdout_lines | difference(k3s_expected_node_names) }}.

    - name: Require every Node to be Ready
      ansible.builtin.command:
        argv: ["{{ k3s_binary_path }}", kubectl, wait, "--for=condition=Ready", "node/{{ item }}", "--timeout=300s"]
      loop: "{{ k3s_expected_node_names }}"
      loop_control:
        label: "{{ item }}"
      changed_when: false
