---
- name: Validate shutdown approval inventory and every K3s server
  hosts: k3s_cluster
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Require both confirmations and the complete inventory
      ansible.builtin.assert:
        that:
          - k3s_power_action | default('') == 'shutdown'
          - k3s_shutdown_confirm | default('') == 'SHUTDOWN_K3S_CLUSTER'
          - ansible_limit is not defined or ansible_limit | trim | length == 0
          - "'masters' in groups"
          - "'workers' in groups"
          - "'k3s_cluster' in groups"
          - groups.masters | length == 1
          - groups.workers | length == 2
          - groups.k3s_cluster | length == 3
          - groups.masters | intersect(groups.workers) | length == 0
          - groups.k3s_cluster | sort == (groups.masters + groups.workers) | sort
        fail_msg: Approved Shutdown requires both confirmations, all three hosts, and no --limit.
      run_once: true
      delegate_to: localhost

    - name: Verify Ansible connectivity
      ansible.builtin.ping:

    - name: Verify noninteractive sudo
      ansible.builtin.command:
        argv: ["true"]
      become: true
      changed_when: false

    - name: Require active K3s service
      ansible.builtin.command:
        argv: [systemctl, is-active, k3s]
      become: true
      changed_when: false

- name: Complete all Kubernetes and storage checks before poweroff
  hosts: masters
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    k3s_binary_path: /usr/local/bin/k3s
    k3s_shutdown_check_longhorn: true
  tasks:
    - name: Require local API and etcd readiness
      ansible.builtin.command:
        argv: ["{{ k3s_binary_path }}", kubectl, get, "--raw=/readyz?verbose"]
      register: k3s_shutdown_readyz
      changed_when: false
      failed_when: >-
        k3s_shutdown_readyz.rc != 0
        or 'readyz check passed' not in k3s_shutdown_readyz.stdout
        or '[+]etcd ok' not in k3s_shutdown_readyz.stdout

    - name: Read Kubernetes Node names
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - nodes
          - --no-headers
          - --output=custom-columns=NAME:.metadata.name
      register: k3s_shutdown_nodes
      changed_when: false

    - name: Build expected Node names
      ansible.builtin.set_fact:
        k3s_expected_node_names: "{{ groups.k3s_cluster }}"

    - name: Validate and store live Kubernetes Node names
      ansible.builtin.include_tasks: ../../tasks/k3s-node-names.yml
      vars:
        k3s_node_name_result: "{{ k3s_shutdown_nodes }}"
        k3s_node_name_fact: k3s_shutdown_node_names

    - name: Require exact Node membership
      ansible.builtin.assert:
        that:
          - k3s_shutdown_node_names | length == 3
          - k3s_shutdown_node_names | unique | length == 3
          - k3s_expected_node_names | sort == k3s_shutdown_node_names | sort
        fail_msg: >-
          Node mismatch; missing={{ k3s_expected_node_names | difference(k3s_shutdown_node_names) }},
          unexpected={{ k3s_shutdown_node_names | difference(k3s_expected_node_names) }}.

    - name: Require every Node to be Ready
      ansible.builtin.command:
        argv: ["{{ k3s_binary_path }}", kubectl, wait, "--for=condition=Ready", "node/{{ item }}", "--timeout=30s"]
      loop: "{{ k3s_expected_node_names }}"
      loop_control:
        label: "{{ item }}"
      changed_when: false

    - name: Read Longhorn backup states
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - backups.longhorn.io
          - --all-namespaces
          - --no-headers
          - --output=custom-columns=STATE:.status.state
      register: k3s_longhorn_backup_states
      changed_when: false
      when: k3s_shutdown_check_longhorn | bool

    - name: Read Longhorn Engines for restore validation
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - engines.longhorn.io
          - --all-namespaces
          - --output=json
      register: k3s_longhorn_engines
      changed_when: false
      no_log: true
      when: k3s_shutdown_check_longhorn | bool

    - name: Validate Longhorn Engine restore state locally
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../../scripts/check-longhorn-restore.py"
        stdin: "{{ k3s_longhorn_engines.stdout }}"
      register: k3s_longhorn_restore_check
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true
      when: k3s_shutdown_check_longhorn | bool

    - name: Validate Longhorn backup query output
      ansible.builtin.assert:
        that:
          - >-
            k3s_longhorn_backup_states.stdout | length == 0
            or (k3s_longhorn_backup_states.stdout_lines | length > 0
                and k3s_longhorn_backup_states.stdout_lines
                    | reject('match', '^[A-Za-z][A-Za-z0-9_-]*$')
                    | list | length == 0)
        fail_msg: Unparseable Longhorn backup output blocks shutdown.
      when: k3s_shutdown_check_longhorn | bool

    - name: Require no active Longhorn backup
      ansible.builtin.assert:
        that:
          - k3s_longhorn_backup_states.stdout_lines | intersect(['New', 'Pending', 'InProgress']) | length == 0
        fail_msg: An active Longhorn backup blocks shutdown.
      when: k3s_shutdown_check_longhorn | bool

    - name: Report skipped Longhorn storage gate
      ansible.builtin.debug:
        msg: "Longhorn storage safety: NOT_CHECKED"
      when: not (k3s_shutdown_check_longhorn | bool)

# Safety boundary: after this point no Kubernetes API command is permitted.
- name: Power off workers sequentially
  hosts: workers
  gather_facts: false
  become: true
  serial: 1
  order: inventory
  any_errors_fatal: true
  vars:
    k3s_poweroff_wait_timeout: 180
  tasks:
    - name: Request worker poweroff and require SSH closure
      block:
        - name: Request nonblocking system poweroff
          ansible.builtin.command:
            argv: [systemctl, poweroff, --no-block]
          changed_when: true

        - name: Wait locally until SSH stops responding
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: "{{ ansible_port | default(22) }}"
            state: stopped
            connect_timeout: 3
            sleep: 2
            timeout: "{{ k3s_poweroff_wait_timeout }}"
          delegate_to: localhost
          become: false

        - name: Report worker observation
          ansible.builtin.debug:
            msg:
              stage: worker_poweroff
              host: "{{ inventory_hostname }}"
              observation: SSH_NOT_RESPONDING

      rescue:
        - name: Probe inventory SSH endpoints after partial worker failure
          ansible.builtin.wait_for:
            host: "{{ hostvars[item].ansible_host }}"
            port: "{{ hostvars[item].ansible_port | default(22) }}"
            state: started
            connect_timeout: 1
            timeout: 1
          loop: "{{ groups.k3s_cluster }}"
          register: k3s_partial_probes
          delegate_to: localhost
          become: false
          failed_when: false

        - name: Report partial worker shutdown
          ansible.builtin.debug:
            msg:
              stage: worker_poweroff
              host: "{{ inventory_hostname }}"
              ssh_responding: >-
                {{ k3s_partial_probes.results
                   | selectattr('state', 'defined')
                   | selectattr('state', 'equalto', 'started')
                   | map(attribute='item') | list }}
              ssh_not_responding_or_unreachable_unknown: >-
                {{ groups.k3s_cluster
                   | difference(k3s_partial_probes.results
                                | selectattr('state', 'defined')
                                | selectattr('state', 'equalto', 'started')
                                | map(attribute='item') | list) }}

        - name: Stop partial worker shutdown
          ansible.builtin.fail:
            msg: Partial shutdown stopped before the next host.

- name: Power off the master last
  hosts: masters
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    k3s_poweroff_wait_timeout: 180
  tasks:
    - name: Request master poweroff and require SSH closure
      block:
        - name: Request nonblocking system poweroff
          ansible.builtin.command:
            argv: [systemctl, poweroff, --no-block]
          changed_when: true

        - name: Wait locally until SSH stops responding
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: "{{ ansible_port | default(22) }}"
            state: stopped
            connect_timeout: 3
            sleep: 2
            timeout: "{{ k3s_poweroff_wait_timeout }}"
          delegate_to: localhost
          become: false

        - name: Report final observation
          ansible.builtin.debug:
            msg:
              stage: master_poweroff
              host: "{{ inventory_hostname }}"
              observation: SSH_NOT_RESPONDING

      rescue:
        - name: Probe inventory SSH endpoints after partial master failure
          ansible.builtin.wait_for:
            host: "{{ hostvars[item].ansible_host }}"
            port: "{{ hostvars[item].ansible_port | default(22) }}"
            state: started
            connect_timeout: 1
            timeout: 1
          loop: "{{ groups.k3s_cluster }}"
          register: k3s_partial_probes
          delegate_to: localhost
          become: false
          failed_when: false

        - name: Report partial final shutdown
          ansible.builtin.debug:
            msg:
              stage: master_poweroff
              host: "{{ inventory_hostname }}"
              ssh_responding: >-
                {{ k3s_partial_probes.results
                   | selectattr('state', 'defined')
                   | selectattr('state', 'equalto', 'started')
                   | map(attribute='item') | list }}
              ssh_not_responding_or_unreachable_unknown: >-
                {{ groups.k3s_cluster
                   | difference(k3s_partial_probes.results
                                | selectattr('state', 'defined')
                                | selectattr('state', 'equalto', 'started')
                                | map(attribute='item') | list) }}

        - name: Stop partial master shutdown
          ansible.builtin.fail:
            msg: Partial final shutdown requires manual verification.
