---
- name: Audit K3s server connectivity
  hosts: k3s_servers
  gather_facts: false
  tasks:
    - name: Check and report Ansible connectivity
      block:
        - name: Check Ansible connectivity
          ansible.builtin.ping:
          register: k3s_connectivity_audit
          ignore_unreachable: true

        - name: Require confirmed Ansible connectivity
          ansible.builtin.assert:
            that:
              - not (k3s_connectivity_audit.unreachable | default(false))
              - k3s_connectivity_audit.ping | default('') == 'pong'
          delegate_to: localhost
          become: false
      always:
        - name: K3s connectivity summary
          ansible.builtin.debug:
            msg: "{{ lookup('ansible.builtin.template', '../../templates/k3s-connectivity-summary.j2').splitlines() }}"
          delegate_to: localhost
          become: false
          run_once: true
