---
- name: Audit K3s server connectivity
  hosts: k3s_servers
  gather_facts: false
  tasks:
    - name: Check Ansible connectivity
      ansible.builtin.ping:

    - name: Report reachable host
      ansible.builtin.debug:
        msg: >-
          Connected to {{ inventory_hostname }} at {{ ansible_host }} on SSH
          port {{ ansible_port | default('selected by the SSH transport') }}.
